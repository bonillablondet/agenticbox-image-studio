<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
        (() => {
            let theme = "system";
            try {
                theme = JSON.parse(localStorage.getItem("sdcpp-webui-theme"));
            } catch {}
            document.documentElement.dataset.theme = theme === "light" || theme === "dark"
                ? theme
                : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        })();
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111827'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='sans-serif' font-size='27' fill='white'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E" />
    <title>AgenticBox ImageStudio</title>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
